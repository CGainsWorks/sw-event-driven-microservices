# The whole system, from one command.
#
#   docker compose up --build
#
# Milestone status: orders and payments are implemented. inventory and notifications are
# not yet built, and are deliberately absent from this file rather than present as empty
# containers — a service that exists but does nothing is worse than one that is honestly
# missing.
#
# Each service has its own database. There is no shared schema, no cross-service SQL, and
# the two PostgreSQL instances cannot see each other. That is the boundary from
# docs/service_boundaries.md made real in the topology rather than merely asserted.

name: sw-edm

x-postgres-common: &postgres-common
  image: postgres:17-alpine
  restart: unless-stopped
  healthcheck:
    # pg_isready against the specific database and user, not just the port. A listening
    # port is not the same as a database that will accept a connection, and the difference
    # is a service that starts, fails its first query and restart-loops.
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 2s
    timeout: 3s
    retries: 30
    start_period: 5s

x-go-service-common: &go-service-common
  restart: unless-stopped
  environment: &go-service-env
    LOG_LEVEL: ${LOG_LEVEL:-info}
    KAFKA_BROKERS: kafka:9092
    OUTBOX_POLL_INTERVAL: 250ms

services:
  # --- data stores ----------------------------------------------------------

  postgres-orders:
    <<: *postgres-common
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders
    ports:
      # Exposed for the integration tests and for looking at the saga log by hand during
      # a failure investigation. Not something a production topology would do.
      - "${ORDERS_DB_PORT:-55432}:5432"
    volumes:
      - orders-db:/var/lib/postgresql/data

  postgres-payments:
    <<: *postgres-common
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    ports:
      - "${PAYMENTS_DB_PORT:-55433}:5432"
    volumes:
      - payments-db:/var/lib/postgresql/data

  # --- broker ---------------------------------------------------------------

  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    environment:
      # KRaft: one process acting as both broker and controller. No ZooKeeper, which
      # removes a container, a failure mode and a set of version constraints.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # Single broker, so everything that defaults to 3 has to come down to 1. In
      # deploy/k8s these are 3 and 2, which is the minimum that survives losing a broker.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1

      # Zero, so a consumer group forms immediately instead of waiting three seconds on
      # every start. Only sensible because this is a development cluster.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Off, deliberately. Topics come from scripts/create_topics.sh with chosen partition
      # counts; auto-creation would silently produce one-partition topics and destroy the
      # per-aggregate ordering the whole design depends on.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: sw-edm-local-cluster-01
    ports:
      # EXTERNAL listener, so integration tests running on the host can reach the broker
      # by the same name the containers use internally would not resolve.
      - "${KAFKA_PORT:-29092}:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/create_topics.sh"]
    environment:
      KAFKA_BROKERS: kafka:9092
    # Runs once and exits. Services wait for it to complete successfully, so nothing
    # starts producing before its topic exists.
    restart: "no"

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      # BACKWARD by default; payments subjects are raised to BACKWARD_TRANSITIVE by
      # scripts/register_schemas.sh, per events/registry/config.yml.
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward
    ports:
      - "${SCHEMA_REGISTRY_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/subjects || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # --- services -------------------------------------------------------------

  payments:
    <<: *go-service-common
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: payments
        VERSION: ${VERSION:-dev}
    depends_on:
      postgres-payments:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      <<: *go-service-env
      DATABASE_URL: postgres://payments:payments@postgres-payments:5432/payments?sslmode=disable
      GRPC_ADDR: ":50051"
      HEALTH_ADDR: ":8080"
      AUTHORIZATION_TTL: ${AUTHORIZATION_TTL:-168h}
    ports:
      - "${PAYMENTS_GRPC_PORT:-50051}:50051"
      - "${PAYMENTS_HTTP_PORT:-18081}:8080"
    # No compose healthcheck. The distroless image has no shell and no curl, so there is
    # nothing inside the container that can run one, and adding a shell purely to satisfy
    # compose would undo the reason for choosing distroless. Readiness is served over HTTP
    # on :8080 and the integration tests probe it over the published port. Under
    # Kubernetes, deploy/k8s uses a native HTTP probe, which needs nothing in the image.

  orders:
    <<: *go-service-common
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: orders
        VERSION: ${VERSION:-dev}
    depends_on:
      postgres-orders:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      payments:
        condition: service_started
    environment:
      <<: *go-service-env
      DATABASE_URL: postgres://orders:orders@postgres-orders:5432/orders?sslmode=disable
      HTTP_ADDR: ":8080"
      PAYMENTS_GRPC_ADDR: payments:50051
      SAGA_STEP_TIMEOUT: ${SAGA_STEP_TIMEOUT:-10s}
      SAGA_RECOVERY_INTERVAL: ${SAGA_RECOVERY_INTERVAL:-2s}
    ports:
      - "${ORDERS_HTTP_PORT:-18080}:8080"

volumes:
  orders-db:
  payments-db:
  kafka-data:
