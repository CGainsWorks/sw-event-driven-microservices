apiVersion: 1

providers:
  - name: sw-edm
    type: file
    disableDeletion: true
    # The dashboard is a file in the repository, not something edited in the UI and
    # forgotten. Edits made in Grafana are lost on restart, which is the point: a dashboard
    # that only exists in one person's browser is not a deliverable.
    allowUiUpdates: false
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
