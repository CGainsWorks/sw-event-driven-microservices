# OpenTelemetry collector and Jaeger.
#
# Services export to the collector, never to Jaeger directly. That indirection is why
# swapping the backend or adding tail sampling is a change to one ConfigMap rather than a
# redeploy of four services in two languages.
---
# The otel-collector-config ConfigMap is NOT defined here.
#
# scripts/kind_up.sh creates it from deploy/otel/collector.yaml, which is the same file the
# compose collector mounts. See the note in 20-kafka.yaml for why a placeholder here would
# be actively harmful rather than merely redundant.
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: sw-edm
spec:
  selector: { app: otel-collector }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    - { name: otlp-http, port: 4318, targetPort: 4318 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: sw-edm
spec:
  replicas: 1
  selector: { matchLabels: { app: otel-collector } }
  template:
    metadata:
      labels: { app: otel-collector }
      annotations:
        # Forces a rollout when the config changes. Without it, editing the ConfigMap
        # leaves the running collector on the old config and the change appears to have
        # done nothing.
        checksum/config: "replaced-by-kind-up"
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.140.0
          args: ["--config=/etc/otel/config.yaml"]
          ports:
            - { containerPort: 4317 }
            - { containerPort: 4318 }
          volumeMounts: [{ name: config, mountPath: /etc/otel }]
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
      volumes:
        - name: config
          configMap: { name: otel-collector-config, items: [{ key: config.yaml, path: config.yaml }] }
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: sw-edm
spec:
  selector: { app: jaeger }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    - { name: ui, port: 16686, targetPort: 16686 }
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-ui
  namespace: sw-edm
spec:
  type: NodePort
  selector: { app: jaeger }
  ports:
    - { name: ui, port: 16686, targetPort: 16686, nodePort: 30686 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: sw-edm
spec:
  replicas: 1
  selector: { matchLabels: { app: jaeger } }
  template:
    metadata:
      labels: { app: jaeger }
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.11.0
          env:
            - { name: COLLECTOR_OTLP_ENABLED, value: "true" }
          ports:
            - { containerPort: 4317 }
            - { containerPort: 16686 }
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            # In-memory storage, so traces are lost when this pod restarts. Correct for a
            # demo cluster and for nothing else.
            limits: { memory: 768Mi }
